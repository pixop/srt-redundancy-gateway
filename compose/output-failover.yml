services:
  output-gateway:
    build:
      context: ..
      dockerfile: docker/tsduck-gateway/Dockerfile
    container_name: srt-output-gateway
    network_mode: host
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NODE_A_PORT: ${NODE_A_PORT:-7001}
      NODE_B_PORT: ${NODE_B_PORT:-7002}
      OUTPUT_FAILOVER_OUTPUT_LISTEN_PORT: ${OUTPUT_FAILOVER_OUTPUT_LISTEN_PORT:-8000}
      OUTPUT_FAILOVER_RECEIVE_TIMEOUT_MS: ${OUTPUT_FAILOVER_RECEIVE_TIMEOUT_MS:-2000}
      TSSWITCH_REMOTE_HOST: ${TSSWITCH_REMOTE_HOST:-127.0.0.1}
      TSSWITCH_REMOTE_PORT: ${TSSWITCH_REMOTE_PORT:-4444}
      TSSWITCH_ALLOW_HOST: ${TSSWITCH_ALLOW_HOST:-127.0.0.1}
      TSSWITCH_EVENT_UDP_HOST: ${TSSWITCH_EVENT_UDP_HOST:-127.0.0.1}
      TSSWITCH_EVENT_UDP_PORT: ${TSSWITCH_EVENT_UDP_PORT:-5556}
      OUTPUT_FAILOVER_VERBOSE: ${OUTPUT_FAILOVER_VERBOSE:-1}
    command: ["bash", "/app/gateway/commands/output-failover.sh"]

  watchdog:
    build:
      context: ..
      dockerfile: docker/health-watchdog/Dockerfile
    container_name: srt-output-watchdog
    network_mode: host
    restart: unless-stopped
    depends_on:
      - output-gateway
    env_file:
      - ../.env
    environment:
      WATCHDOG_POLL_INTERVAL_SEC: ${WATCHDOG_POLL_INTERVAL_SEC:-1.0}
      WATCHDOG_HEALTH_TIMEOUT_SEC: ${WATCHDOG_HEALTH_TIMEOUT_SEC:-1.5}
      WATCHDOG_GOOD_THRESHOLD: ${WATCHDOG_GOOD_THRESHOLD:-3}
      WATCHDOG_BAD_THRESHOLD: ${WATCHDOG_BAD_THRESHOLD:-3}
      WATCHDOG_INITIAL_ACTIVE_INPUT: ${WATCHDOG_INITIAL_ACTIVE_INPUT:-0}
      TSSWITCH_REMOTE_HOST: ${TSSWITCH_REMOTE_HOST:-127.0.0.1}
      TSSWITCH_REMOTE_PORT: ${TSSWITCH_REMOTE_PORT:-4444}
      WATCHDOG_METRICS_HOST: ${WATCHDOG_METRICS_HOST:-0.0.0.0}
      WATCHDOG_METRICS_PORT: ${WATCHDOG_METRICS_PORT:-9108}
      WATCHDOG_ENABLE_WAITING_INFERENCE: ${WATCHDOG_ENABLE_WAITING_INFERENCE:-true}
      WATCHDOG_WAITING_FLAP_WINDOW_SEC: ${WATCHDOG_WAITING_FLAP_WINDOW_SEC:-8.0}
      WATCHDOG_WAITING_FLAP_THRESHOLD: ${WATCHDOG_WAITING_FLAP_THRESHOLD:-3}
      WATCHDOG_EVENT_LISTEN_HOST: ${WATCHDOG_EVENT_LISTEN_HOST:-0.0.0.0}
      WATCHDOG_EVENT_LISTEN_PORT: ${WATCHDOG_EVENT_LISTEN_PORT:-5556}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-srt-redundancy-watchdog}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://127.0.0.1:4318/v1/traces}

  output-bridge-a:
    build:
      context: ..
      dockerfile: docker/tsduck-gateway/Dockerfile
    container_name: srt-output-bridge-a
    network_mode: host
    restart: unless-stopped
    profiles: ["bridge-connectors"]
    depends_on:
      - output-gateway
    env_file:
      - ../.env
    environment:
      BRIDGE_NAME: output-bridge-a
      BRIDGE_KEY: A
      BRIDGE_VERBOSE: ${BRIDGE_VERBOSE:-1}
      BRIDGE_SRT_COMMON_FLAGS: ${BRIDGE_SRT_COMMON_FLAGS:---transtype live --messageapi}
    command: ["bash", "/app/gateway/commands/output-bridge.sh"]

  output-bridge-b:
    build:
      context: ..
      dockerfile: docker/tsduck-gateway/Dockerfile
    container_name: srt-output-bridge-b
    network_mode: host
    restart: unless-stopped
    profiles: ["bridge-connectors"]
    depends_on:
      - output-gateway
    env_file:
      - ../.env
    environment:
      BRIDGE_NAME: output-bridge-b
      BRIDGE_KEY: B
      BRIDGE_VERBOSE: ${BRIDGE_VERBOSE:-1}
      BRIDGE_SRT_COMMON_FLAGS: ${BRIDGE_SRT_COMMON_FLAGS:---transtype live --messageapi}
    command: ["bash", "/app/gateway/commands/output-bridge.sh"]

  mock-health-a:
    image: python:3.12-slim
    container_name: srt-mock-health-a
    network_mode: host
    restart: unless-stopped
    profiles: ["demo-health"]
    volumes:
      - ../examples:/app/examples:ro
    environment:
      MOCK_HEALTH_HOST: 0.0.0.0
      MOCK_HEALTH_PORT: 18081
      MOCK_INITIAL_HEALTHY: true
      MOCK_HEALTH_TOKEN: ${MOCK_HEALTH_TOKEN:-devtoken}
    command: ["python", "/app/examples/mock-health-service.py"]

  mock-health-b:
    image: python:3.12-slim
    container_name: srt-mock-health-b
    network_mode: host
    restart: unless-stopped
    profiles: ["demo-health"]
    volumes:
      - ../examples:/app/examples:ro
    environment:
      MOCK_HEALTH_HOST: 0.0.0.0
      MOCK_HEALTH_PORT: 18082
      MOCK_INITIAL_HEALTHY: true
      MOCK_HEALTH_TOKEN: ${MOCK_HEALTH_TOKEN:-devtoken}
    command: ["python", "/app/examples/mock-health-service.py"]
