services:
  input-gateway:
    build:
      context: ..
      dockerfile: docker/tsduck-gateway/Dockerfile
    container_name: srt-input-gateway
    network_mode: host
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      PRIMARY_LISTEN_PORT: ${PRIMARY_LISTEN_PORT:-5000}
      BACKUP_LISTEN_PORT: ${BACKUP_LISTEN_PORT:-5010}
      INPUT_FAILOVER_OUTPUT_LISTEN_PORT: ${INPUT_FAILOVER_OUTPUT_LISTEN_PORT:-6000}
      INPUT_FAILOVER_RECEIVE_TIMEOUT_MS: ${INPUT_FAILOVER_RECEIVE_TIMEOUT_MS:-2000}
      INPUT_FAILOVER_VERBOSE: ${INPUT_FAILOVER_VERBOSE:-1}
    command: ["bash", "/app/gateway/commands/input-failover.sh"]
services:
  input-gateway:
    build:
      context: ..
      dockerfile: docker/tsduck-gateway/Dockerfile
    image: srt-redundancy/tsduck-gateway:local
    network_mode: host
    command: ["/app/commands/input-failover.sh"]
    environment:
      COMMAND_DEBUG: ${COMMAND_DEBUG:-true}
      PRIMARY_LISTEN_PORT: ${PRIMARY_LISTEN_PORT:-5000}
      BACKUP_LISTEN_PORT: ${BACKUP_LISTEN_PORT:-5010}
      INPUT_OUTPUT_LISTEN_PORT: ${INPUT_OUTPUT_LISTEN_PORT:-6000}
      INPUT_RECEIVE_TIMEOUT_MS: ${INPUT_RECEIVE_TIMEOUT_MS:-2000}
      INPUT_PRIMARY_INDEX: ${INPUT_PRIMARY_INDEX:-0}
      INPUT_FAST_SWITCH: ${INPUT_FAST_SWITCH:-true}
      INPUT_INFINITE: ${INPUT_INFINITE:-true}
      SRT_COMMON_FLAGS: ${SRT_COMMON_FLAGS:---multiple --transtype live --messageapi}
    restart: unless-stopped
